<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="CSS/calculadora.css" />
  </head>
  <body>
    <div class="calculadora">
      <div class="pantalla">
        <p>123</p>
      </div>

      <div class="btn-numeros">
        <button id="btn-1">1</button>
        <button id="btn-2">2</button>
        <button id="btn-3">3</button>
        <button id="btn-4">4</button>
        <button id="btn-5">5</button>
        <button id="btn-6">6</button>
        <button id="btn-7">7</button>
        <button id="btn-8">8</button>
        <button id="btn-9">9</button>
        <button id="btn-0">0</button>
      </div>

      <div class="btn-operadores">
        <button id="btn-suma">+</button>
        <button id="btn-resta">-</button>
        <button id="btn-multiplicacion">*</button>
        <button id="btn-division">/</button>
      </div>

      <div class="btn-borrar-igual">
        <button id="btn-igual">=</button>
        <button id="btn-borrar">Borrar</button>
      </div>
    </div>
    <script src="JS/calculadora.js"></script>
  </body>
</html>
